plugins:
- rubocop-md
- rubocop-prose
- rubocop-rake
- rubocop-spellcheck
- rubocop-yaml

inherit_from: ".rubocop_todo.yml"

AllCops:
  TargetRubyVersion: 2.6
  NewCops: enable
  Include:
  - ".github/**/*.yml"
  - ".rubocop.yml"
  Exclude:
  - gemfiles/vendor/**/*
  - perf/benchmark.rb
  - spec/support/apps/**/*
  - tmp/**/*
  - vendor/**/*
  - coverage/**/*
  - pkg/**/*
  DisplayCopNames: true
  UseCache: true
  CacheRootDirectory: "./tmp"
  SuggestExtensions: false
  inherit_mode:
    merge:
    - Include

Style/Documentation:
  Enabled: false
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Style/StringLiterals:
  EnforcedStyle: double_quotes
  inherit_mode:
    merge:
    - Exclude

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/ParameterAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/MultilineOperationIndentation:
  EnforcedStyle: indented
  inherit_mode:
    merge:
    - Exclude

Layout/HashAlignment:
  EnforcedLastArgumentHashStyle: ignore_implicit

Style/HashSyntax:
  EnforcedStyle: hash_rockets
  inherit_mode:
    merge:
    - Exclude

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Style/FormatString:
  EnforcedStyle: sprintf

Metrics/MethodLength:
  Max: 15
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

YAML/Lint/InvalidSyntax:
  Include:
  - "**/*.yml"
  - "**/*.yaml"

YAML/Lint/DuplicateKey:
  Include:
  - "**/*.yml"
  - "**/*.yaml"

Naming/FileName:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"
  - ".github/workflows/*.yml"

Metrics/AbcSize:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Naming/HeredocDelimiterNaming:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Style/SafeNavigation:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Style/OneClassPerFile:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Lint/UselessAssignment:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Style/MultilineBlockChain:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Style/SymbolProc:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Lint/Void:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Metrics/BlockLength:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - Gemfile

Layout/LineLength:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - ".github/workflows/*.yml"

Markdown/HeadingCapitalization:
  Enabled: true
  Style: title_case

Prose/MaxLength:
  Max: false
  Exclude:
  - LICENSE

Spellcheck:
  DictionaryFiles:
    en:
    - gem:rubocop-spellcheck/data/en/en.dic
    - ".spellcheck.txt"

Spellcheck/Spelling:
  Exclude:
  - LICENSE
